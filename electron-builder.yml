appId: com.sorisoop.lyrics
productName: SoriSoop MV Studio
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - public/fonts/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/@huggingface/transformers/**/*
fileAssociations:
  - ext: ssproj
    name: Sorisoop Project
    description: SoriSoop MV Studio Project File
    role: Editor
    rank: Owner
mac:
  icon: app-icon.icns
  category: public.app-category.video
  artifactName: SoriSoop_MV_Studio_v${version}-Mac-${arch}.${ext}
  extendInfo:
    CFBundleDisplayName: 소리숲 뮤직비디오 스튜디오
    LSHasLocalizedDisplayName: true
  extraResources:
    - from: build/mac/ko.lproj
      to: ko.lproj
  target:
    - dmg
    - zip
win:
  icon: app-icon.png
  artifactName: SoriSoop_MV_Studio_v${version}-Windows.${ext}
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 소리숲 뮤직비디오 스튜디오
  uninstallDisplayName: 소리숲 뮤직비디오 스튜디오
